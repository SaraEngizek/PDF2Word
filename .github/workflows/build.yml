name: Build PDF2Word

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Homebrew dependencies
        run: |
          brew install poppler tesseract tesseract-lang

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pytesseract pdf2image Pillow numpy python-docx pyinstaller

      - name: Bundle Tesseract for macOS
        run: |
          mkdir -p portable-build/tesseract-bundle/macos/bin
          mkdir -p portable-build/tesseract-bundle/tessdata

          # Tesseract binary kopyala
          cp /opt/homebrew/bin/tesseract portable-build/tesseract-bundle/macos/bin/ 2>/dev/null || \
          cp /usr/local/bin/tesseract portable-build/tesseract-bundle/macos/bin/ 2>/dev/null || true

          # Tessdata kopyala
          cp /opt/homebrew/share/tessdata/*.traineddata portable-build/tesseract-bundle/tessdata/ 2>/dev/null || \
          cp /usr/local/share/tessdata/*.traineddata portable-build/tesseract-bundle/tessdata/ 2>/dev/null || true

      - name: Create icon
        run: |
          cd assets/icons
          python create_icon.py
          iconutil -c icns app.iconset -o app.icns || true

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm portable-build/specs/macos_portable.spec

      - name: Create DMG
        run: |
          if [ -d "dist/PDF2Word.app" ]; then
            hdiutil create -volname "PDF2Word" -srcfolder "dist/PDF2Word.app" -ov -format UDZO "dist/PDF2Word_macOS.dmg"
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF2Word-macOS
          path: |
            dist/PDF2Word.app
            dist/PDF2Word_macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download and Bundle Poppler
        run: |
          Invoke-WebRequest -Uri "https://github.com/oschwartz10612/poppler-windows/releases/download/v24.02.0-0/Release-24.02.0-0.zip" -OutFile "poppler.zip"
          Expand-Archive -Path "poppler.zip" -DestinationPath "C:\poppler"

          # Poppler'ı bundle klasörüne kopyala
          New-Item -ItemType Directory -Force -Path "portable-build\poppler-bundle\windows"
          Copy-Item -Path "C:\poppler\poppler-24.02.0\Library\bin\*" -Destination "portable-build\poppler-bundle\windows\" -Recurse

          echo "C:\poppler\poppler-24.02.0\Library\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download and Bundle Tesseract
        run: |
          # Chocolatey ile Tesseract kur
          choco install tesseract --no-progress -y

          # Tesseract'ı bundle klasörüne kopyala
          New-Item -ItemType Directory -Force -Path "portable-build\tesseract-bundle\windows"
          Copy-Item -Path "C:\Program Files\Tesseract-OCR\*" -Destination "portable-build\tesseract-bundle\windows\" -Recurse -ErrorAction SilentlyContinue

          # Tessdata ayrıca kopyala
          New-Item -ItemType Directory -Force -Path "portable-build\tesseract-bundle\tessdata"
          Copy-Item -Path "C:\Program Files\Tesseract-OCR\tessdata\*" -Destination "portable-build\tesseract-bundle\tessdata\" -Recurse -ErrorAction SilentlyContinue

          # Kontrol
          Write-Host "=== Tesseract bundle ==="
          Get-ChildItem "portable-build\tesseract-bundle\windows" -ErrorAction SilentlyContinue
          Write-Host "=== Tessdata ==="
          Get-ChildItem "portable-build\tesseract-bundle\tessdata" -ErrorAction SilentlyContinue

          echo "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pytesseract pdf2image Pillow numpy python-docx pyinstaller

      - name: Create icon
        run: |
          cd assets/icons
          python create_icon.py

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm portable-build/specs/windows_portable.spec

      - name: Create ZIP for release
        run: |
          Compress-Archive -Path dist\PDF2Word_Windows -DestinationPath dist\PDF2Word_Windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF2Word-Windows
          path: |
            dist/PDF2Word_Windows/
            dist/PDF2Word_Windows.zip

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-tur tesseract-ocr-eng
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libopengl0 libglx0 libegl1

      - name: Bundle Tesseract binaries and libs
        run: |
          # Bundle klasörlerini oluştur
          mkdir -p portable-build/tesseract-bundle/linux/bin
          mkdir -p portable-build/tesseract-bundle/linux/lib
          mkdir -p portable-build/tesseract-bundle/tessdata

          # Tesseract binary'yi kopyala
          cp /usr/bin/tesseract portable-build/tesseract-bundle/linux/bin/
          chmod +x portable-build/tesseract-bundle/linux/bin/tesseract

          # Tesseract ve bağımlı kütüphaneleri kopyala
          cp /usr/lib/x86_64-linux-gnu/libtesseract.so* portable-build/tesseract-bundle/linux/lib/ 2>/dev/null || true
          cp /usr/lib/x86_64-linux-gnu/liblept.so* portable-build/tesseract-bundle/linux/lib/ 2>/dev/null || true

          # Tüm bağımlılıkları kopyala
          ldd /usr/bin/tesseract | grep "=> /" | awk '{print $3}' | while read lib; do
            cp "$lib" portable-build/tesseract-bundle/linux/lib/ 2>/dev/null || true
          done

          # Tessdata kopyala (eng ve tur)
          cp /usr/share/tesseract-ocr/5/tessdata/eng.traineddata portable-build/tesseract-bundle/tessdata/ 2>/dev/null || \
          cp /usr/share/tesseract-ocr/4.00/tessdata/eng.traineddata portable-build/tesseract-bundle/tessdata/ 2>/dev/null || true

          cp /usr/share/tesseract-ocr/5/tessdata/tur.traineddata portable-build/tesseract-bundle/tessdata/ 2>/dev/null || \
          cp /usr/share/tesseract-ocr/4.00/tessdata/tur.traineddata portable-build/tesseract-bundle/tessdata/ 2>/dev/null || true

          cp /usr/share/tesseract-ocr/5/tessdata/osd.traineddata portable-build/tesseract-bundle/tessdata/ 2>/dev/null || \
          cp /usr/share/tesseract-ocr/4.00/tessdata/osd.traineddata portable-build/tesseract-bundle/tessdata/ 2>/dev/null || true

          echo "=== Tesseract bundle contents ==="
          find portable-build/tesseract-bundle -type f | head -30

      - name: Bundle Poppler binaries and libs
        run: |
          mkdir -p portable-build/poppler-bundle/linux/bin
          mkdir -p portable-build/poppler-bundle/linux/lib

          # Poppler binary'leri kopyala
          cp /usr/bin/pdftoppm portable-build/poppler-bundle/linux/bin/
          cp /usr/bin/pdfinfo portable-build/poppler-bundle/linux/bin/
          chmod +x portable-build/poppler-bundle/linux/bin/*

          # Poppler kütüphaneleri
          cp /usr/lib/x86_64-linux-gnu/libpoppler.so* portable-build/poppler-bundle/linux/lib/ 2>/dev/null || true

          # Tüm bağımlılıkları kopyala
          ldd /usr/bin/pdftoppm | grep "=> /" | awk '{print $3}' | while read lib; do
            cp "$lib" portable-build/poppler-bundle/linux/lib/ 2>/dev/null || true
          done

          echo "=== Poppler bundle contents ==="
          find portable-build/poppler-bundle -type f | head -20

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pytesseract pdf2image Pillow numpy python-docx pyinstaller

      - name: Create icon
        run: |
          cd assets/icons
          python create_icon.py

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm portable-build/specs/linux_portable.spec

      - name: Create runner script
        run: |
          echo '#!/bin/bash' > dist/PDF2Word_Linux/run.sh
          echo 'DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"' >> dist/PDF2Word_Linux/run.sh
          echo 'export LD_LIBRARY_PATH="$DIR/_internal/tesseract/lib:$DIR/_internal/poppler/lib:$LD_LIBRARY_PATH"' >> dist/PDF2Word_Linux/run.sh
          echo 'export PATH="$DIR/_internal/tesseract/bin:$DIR/_internal/poppler/bin:$PATH"' >> dist/PDF2Word_Linux/run.sh
          echo 'export TESSDATA_PREFIX="$DIR/_internal/tessdata"' >> dist/PDF2Word_Linux/run.sh
          echo '"$DIR/PDF2Word" "$@"' >> dist/PDF2Word_Linux/run.sh
          chmod +x dist/PDF2Word_Linux/run.sh
          cat dist/PDF2Word_Linux/run.sh

      - name: Create tar.gz for release
        run: |
          cd dist
          tar -czvf PDF2Word_Linux.tar.gz PDF2Word_Linux/

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF2Word-Linux
          path: |
            dist/PDF2Word_Linux/
            dist/PDF2Word_Linux.tar.gz

  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: List downloaded files
        run: |
          find . -type f -name "*.dmg" -o -name "*.zip" -o -name "*.tar.gz"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            PDF2Word-macOS/dist/PDF2Word_macOS.dmg
            PDF2Word-Windows/dist/PDF2Word_Windows.zip
            PDF2Word-Linux/dist/PDF2Word_Linux.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
