version: '3.8'

services:
  ocr-converter:
    build: .
    container_name: ocr-converter
    volumes:
      - ./input:/app/input      # Input files
      - ./output:/app/output    # Output files
    environment:
      - DISPLAY=${DISPLAY}
    network_mode: "none"         # Completely offline
    stdin_open: true
    tty: true
